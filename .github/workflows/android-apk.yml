name: Android APK

# Builds the sideloadable tablet APK and attaches it to the run as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "newsedit/**"
      - "main.py"
      - "buildozer.spec"
      - "android/**"
      - ".github/workflows/android-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git zip unzip autoconf automake libtool \
            libltdl-dev pkg-config cmake libffi-dev libssl-dev zlib1g-dev libncurses-dev \
            libtinfo6 lld patch

      - name: Cache Android SDK/NDK and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec', 'android/recipes/**', 'android/build_apk.sh') }}
          restore-keys: buildozer-

      - name: Build APK
        run: bash android/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: news-package-editor-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: .buildozer/android/platform/build-*/*.log
          if-no-files-found: ignore
