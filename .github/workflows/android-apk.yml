name: Android APK

# Builds the sideloadable tablet APK and attaches it to the run as an artifact.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "newsedit/**"
      - "main.py"
      - "buildozer.spec"
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write  # publishes the APK as a GitHub release for direct download on the tablet

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git zip unzip autoconf automake libtool \
            libltdl-dev pkg-config cmake libffi-dev libssl-dev zlib1g-dev libncurses-dev \
            libtinfo6 lld patch

      - name: Cache Android SDK/NDK and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec', 'android/recipes/**', 'android/build_apk.sh') }}
          restore-keys: buildozer-

      - name: Build APK
        run: |
          set -o pipefail
          bash android/build_apk.sh 2>&1 | tee build.log

      # Repeat the end of the build log as an annotation, readable through the API.
      - name: Report build failure
        if: failure()
        run: |
          grep -v '^#     ' build.log | tail -n 90 | cut -c1-300 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > tail.txt || true
          echo "::error title=Build log tail::$(cat tail.txt)"

      - name: Check the APK contents
        run: |
          APK=$(ls bin/*.apk | head -1)
          LIBS=$(unzip -l "$APK" | grep -oE "lib/[^ ]+/lib(ffmpegbin|ffprobebin|avcodec|python3[^ ]*)\.so" | sort -u | tr '\n' ' ')
          echo "::notice title=APK contents::$(basename "$APK") $(du -h "$APK" | cut -f1) — $LIBS"
          for lib in libffmpegbin.so libffprobebin.so; do
            unzip -l "$APK" | grep -q "$lib" || { echo "::error::$lib is missing from the APK"; exit 1; }
          done

      - name: Publish as the "tablet-apk" release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls bin/*.apk | head -1)
          cp "$APK" NewsPackageEditor.apk
          NOTES="Sideloadable tablet build from ${GITHUB_SHA::7}. Open this page on the tablet and tap NewsPackageEditor.apk to install."
          if gh release view tablet-apk >/dev/null 2>&1; then
            gh release upload tablet-apk NewsPackageEditor.apk --clobber
            gh release edit tablet-apk --notes "$NOTES" --target "$GITHUB_SHA"
          else
            gh release create tablet-apk NewsPackageEditor.apk --title "News Package Editor for tablets" \
              --notes "$NOTES" --target "$GITHUB_SHA" --prerelease
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: news-package-editor-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: .buildozer/android/platform/build-*/*.log
          if-no-files-found: ignore
